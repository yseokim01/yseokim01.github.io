  <style>
    /* TL;DR Banner Style */
    .tldr-banner {
      background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 50%, #1e3a5f 100%);
      color: white;
      padding: 1.5rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .tldr-banner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #d8dce0, #e9ecef);
      opacity: 0.3;
    }

    .tldr-content {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
    }

    .tldr-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      letter-spacing: 0.5px;
    }

    .tldr-text {
      font-size: 1.15rem;
      line-height: 1.6;
      margin: 0;
      font-weight: 400;
    }

    .tldr-text strong {
      color: #7dd3fc;
      font-weight: 600;
    }

    .tldr-highlight {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(125, 211, 252, 0.15);
      padding: 0.25rem 0.75rem;
      border-radius: 6px;
      margin: 0 0.25rem;
      border: 1px solid rgba(125, 211, 252, 0.3);
    }

    /* Abstract Box Style */
    .abstract-box {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.1);
      margin: 2rem auto;
      max-width: 900px;
    }

    .abstract-box .abstract-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 1.5rem;
      text-align: center;
      position: relative;
      padding-bottom: 1rem;
    }

    .abstract-box .abstract-title::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 2px;
    }

    .abstract-box .abstract-content {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #475569;
      text-align: justify;
    }

    .abstract-box .abstract-content p {
      margin-bottom: 1rem;
    }

    .abstract-box .abstract-content p:last-child {
      margin-bottom: 0;
    }

    /* Criterion Box */
    .criterion-box {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 1.5rem;
      margin: 1.5rem 0;
      text-align: center;
    }

    .criterion-box .equation {
      font-size: 1.3rem;
      color: #1e293b;
      margin: 1rem 0;
    }

    /* Comparison Table */
    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      margin: 2rem 0;
      font-size: 0.95rem;
    }

    .comparison-table th,
    .comparison-table td {
      padding: 1rem;
      text-align: center;
      border: 1px solid #e2e8f0;
    }

    .comparison-table th {
      background: #f1f5f9;
      font-weight: 600;
      color: #1e293b;
    }

    .comparison-table tr:nth-child(even) {
      background: #f8fafc;
    }

    .checkmark {
      color: #10b981;
      font-weight: bold;
    }

    .crossmark {
      color: #ef4444;
      font-weight: bold;
    }

    /* Result Cards */
    .result-card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      margin-bottom: 1.5rem;
      border: 1px solid #e2e8f0;
    }

    .result-card h4 {
      color: #1e293b;
      font-weight: 600;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    .metric-highlight {
      font-size: 2rem;
      font-weight: 700;
      color: #2563eb;
    }

    .metric-label {
      color: #64748b;
      font-size: 0.9rem;
    }

    /* Key Insight Box */
    .key-insight {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border-left: 4px solid #f59e0b;
      padding: 1rem 1.5rem;
      border-radius: 0 12px 12px 0;
      margin: 1.5rem 0;
    }

    .key-insight strong {
      color: #92400e;
    }

    /* Section Divider */
    .section-divider {
      height: 4px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 2px;
      margin: 3rem auto;
      width: 100px;
    }

    /* Figure Placeholder */
    .figure-placeholder {
      background: linear-gradient(135deg, #f8fafc, #e2e8f0);
      border-radius: 16px;
      padding: 3rem;
      text-align: center;
      color: #64748b;
      border: 2px dashed #cbd5e1;
    }

    .figure-placeholder i {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: block;
      color: #94a3b8;
    }

    .figure-caption {
      font-size: 0.95rem;
      color: #64748b;
      text-align: center;
      margin-top: 1rem;
      line-height: 1.6;
    }

    /* Understanding ACE Section */
    .understanding-section {
      /* background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); */
      padding: 4rem 0;
      position: relative;
      overflow: hidden;
    }

    .understanding-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%);
      pointer-events: none;
    }

    .understanding-section .section-title {
      color: white;
      text-align: center;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .understanding-section .section-subtitle {
      color: #94a3b8;
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 3rem;
    }

    /* Applications Showcase Section */
    .applications-section {
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      padding: 4rem 0;
      position: relative;
      overflow: hidden;
    }

    .applications-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%);
      pointer-events: none;
    }

    .applications-section .section-title {
      color: white;
      text-align: center;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .applications-section .section-subtitle {
      color: #94a3b8;
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 3rem;
    }

    /* Application Cards Grid */
    .app-cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    @media (max-width: 968px) {
      .app-cards-grid {
        grid-template-columns: 1fr;
      }
    }

    .app-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .app-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border-color: rgba(99, 102, 241, 0.3);
    }

    .app-card-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .app-card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .app-card-icon.molecular {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }

    .app-card-icon.image {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white;
    }

    .app-card-icon.theory {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
    }

    .app-card-title {
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0;
    }

    .app-card-badge {
      margin-left: auto;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .app-card-image {
      width: 100%;
      height: auto;
      display: block;
    }

    .app-card-content {
      padding: 1.25rem 1.5rem;
    }

    .app-card-description {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.6;
      margin: 0;
    }

    .app-card-description strong {
      color: #94a3b8;
      font-weight: 1000;
    }

    /* Full-width application card */
    .app-card.full-width {
      grid-column: 1 / -1;
    }

    .app-card.full-width .app-card-image {
      max-height: 400px;
      object-fit: contain;
      background: #0a0f1a;
    }

    /* Slider styles for multiple images */
    .app-slider {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .app-slider-track {
      display: flex;
      transition: transform 0.5s ease;
    }

    .app-slider-slide {
      min-width: 100%;
      flex-shrink: 0;
    }

    .app-slider-slide img {
      width: 100%;
      height: auto;
      display: block;
    }

    .app-slider-nav {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.3);
    }

    .app-slider-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      border: none;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .app-slider-dot.active {
      background: #6366f1;
      transform: scale(1.3);
    }

    .app-slider-dot:hover {
      background: rgba(255, 255, 255, 0.6);
    }

    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
      z-index: 10;
    }

    .slider-btn:hover {
      background: rgba(99, 102, 241, 0.8);
    }

    .slider-btn.prev {
      left: 10px;
    }

    .slider-btn.next {
      right: 10px;
    }

    /* Feature Pills */
    .feature-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 2rem;
    }

    .feature-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 0.5rem 1rem;
      border-radius: 25px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .feature-pill i {
      color: #6366f1;
    }

    .app-card-desc {
      font-size: 0.9rem;
      color: var(--color-text-muted);
      line-height: 1.6;
    }

    /* Image Gallery */
    .gallery-container {
      position: relative;
      background: #0a0f1a;
    }

    .gallery-wrapper {
      overflow: hidden;
    }

    .gallery-track {
      display: flex;
      transition: transform 0.5s ease;
    }

    .gallery-slide {
      min-width: 100%;
      flex-shrink: 100;
    }

    .gallery-slide img {
      width: 100%;
      height: auto;
      display: block;
    }

    .gallery-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      background: rgba(0,0,0,0.5);
    }

    .gallery-dots {
      display: flex;
      gap: 0.5rem;
    }

    .gallery-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .gallery-dot.active {
      background: var(--color-accent);
      transform: scale(1.2);
    }

    .gallery-dot:hover {
      background: rgba(255,255,255,0.6);
    }

    .gallery-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .gallery-btn:hover {
      background: var(--color-accent);
      border-color: var(--color-accent);
    }

    .gallery-counter {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      /* color: var(--color-text); */
      color: #94a3b8;
    }

    .gallery-prompt {
      padding: 1rem 1.25rem;
      background: rgba(0,0,0,0.3);
      border-top: 1px solid var(--color-border);
    }

    .gallery-prompt-text {
      font-size: 0.9rem;
      /* color: var(--color-text); */
      text-align: center;
      color: #94a3b8;
      font-style: italic;
    }


    /* Problem formulation section */
    .formulation-section {
      background: #ffffff;
      padding-top: 3rem;
      padding-bottom: 3rem;
    }

    .formula-intro {
      color: #475569;
      font-size: 1.03rem;
      line-height: 1.75;
      text-align: center;
      max-width: 900px;
      margin: 0 auto 1.5rem auto;
    }

    .problem-equation {
      background: #f8fafc;
      border: 1px solid #dbeafe;
      max-width: 850px;
      margin: 1.5rem auto;
    }

    .problem-equation .equation {
      font-size: 1.15rem;
      line-height: 2.0;
    }

    .formula-card {
      height: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 4px 16px -8px rgba(15, 23, 42, 0.2);
    }

    .formula-card h4 {
      color: #1e293b;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .formula-card p {
      color: #64748b;
      font-size: 0.92rem;
      line-height: 1.65;
      margin-bottom: 0.65rem;
    }

    .formula-card .mini-equation {
      color: #1e293b;
      background: #f8fafc;
      border-radius: 8px;
      padding: 0.65rem;
      font-size: 0.85rem;
      line-height: 1.6;
      overflow-x: auto;
    }


  </style>
